<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Report a problem or suggest an improvement for Saathi."><meta name="robots" content="index,follow"><link rel="canonical" href="{{BASE_URL}}/support"><link rel="icon" href="/saathi-icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/public.css"><title>Support · Saathi</title></head>
<body><header class="site-header"><nav class="site-nav" aria-label="Main navigation"><a class="brand" href="/"><span class="orb"></span>Saathi</a><div class="nav-links"><a href="/privacy">Privacy</a><a href="/terms">Terms</a><a href="/limitations">AI limits</a></div></nav></header>
<main class="page"><p class="eyebrow">Feedback and support</p><h1>Tell us what is not working or what would help.</h1><p class="lede">Do not include passwords, verification codes, private conversations, medical records or other sensitive information.</p>
<section class="legal-section"><form class="support-form" id="supportForm"><label class="field">Type<select id="supportType" required><option value="technical">Technical problem</option><option value="feature">Feature suggestion</option><option value="general">General feedback</option><option value="privacy">Privacy question</option></select></label><label class="field">Email for a reply, optional<input id="supportEmail" type="email" maxlength="200" autocomplete="email" placeholder="you@example.com"></label><label class="field">Message<textarea id="supportMessage" maxlength="2000" required placeholder="Describe the problem or idea without adding sensitive information."></textarea></label><button class="primary" id="supportButton" type="submit">Send feedback</button><p class="message" id="supportStatus" role="status" aria-live="polite"></p></form></section></main>
<footer class="site-footer"><div class="footer-inner"><span>© 2026 Saathi</span><div class="footer-links"><a href="/privacy">Privacy</a><a href="/terms">Terms</a><a href="/limitations">AI limits</a></div></div></footer>
<script>
const form=document.getElementById('supportForm'),statusBox=document.getElementById('supportStatus'),button=document.getElementById('supportButton');
form.addEventListener('submit',async event=>{event.preventDefault();button.disabled=true;statusBox.className='message';statusBox.textContent='Sending…';try{const response=await fetch('/api/support',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:document.getElementById('supportType').value,email:document.getElementById('supportEmail').value.trim(),message:document.getElementById('supportMessage').value.trim()})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Feedback could not be sent.');form.reset();statusBox.className='message success';statusBox.textContent='Thank you. Your feedback was received.'}catch(error){statusBox.className='message error';statusBox.textContent=error.message}finally{button.disabled=false}});
</script></body></html>
