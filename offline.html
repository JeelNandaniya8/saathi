<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f6f1">
<title>Offline · Saathi</title>
<style>:root{--canvas:#f7f6f1;--paper:#fffefa;--ink:#1e211d;--muted:#71766f;--line:rgba(35,40,33,.11)}*{box-sizing:border-box}body{min-height:100vh;margin:0;padding:22px;background:radial-gradient(circle at 25% 10%,rgba(211,183,104,.22),transparent 32%),var(--canvas);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center}.card{width:min(520px,100%);padding:38px;border:1px solid var(--line);border-radius:28px;background:var(--paper);box-shadow:0 22px 60px rgba(31,35,28,.09);text-align:center}.orb{width:48px;height:48px;margin:0 auto 23px;border-radius:17px;background:radial-gradient(circle at 31% 28%,#f0d780,#b48b2b 58%,#755713);box-shadow:0 0 0 8px rgba(180,139,43,.1)}h1{margin:0;font-size:38px;letter-spacing:-.055em;font-weight:620}p{margin:14px auto 25px;color:var(--muted);font-size:12px;line-height:1.7}button{height:42px;padding:0 18px;border:0;border-radius:12px;background:var(--ink);color:#fff;font:inherit;font-size:10px;font-weight:750;cursor:pointer}</style>
</head>
<body><main class="card"><div class="orb"></div><h1>You are offline.</h1><p>Your saved data stays protected on the server. Reconnect before opening conversations, reminders or account information.</p><button onclick="location.reload()">Try again</button></main></body>
</html>
