name: Classroom background refresh

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/classroom-sync.yml
      - scripts/sync_classroom.py
      - scripts/send_background_alerts.py
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classroom-background-refresh
  cancel-in-progress: false

jobs:
  alerts:
    if: github.repository == 'JeelNandaniya8/saathi' && github.ref == 'refs/heads/main' && vars.CLASSROOM_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deliver general background alerts (no medication schedules)
        env:
          CLASSROOM_SYNC_SECRET: ${{ secrets.CLASSROOM_SYNC_SECRET }}
        run: python3 scripts/send_background_alerts.py
  refresh:
    if: github.repository == 'JeelNandaniya8/saathi' && github.ref == 'refs/heads/main' && vars.CLASSROOM_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refresh opted-in Classroom accounts
        env:
          CLASSROOM_SYNC_SECRET: ${{ secrets.CLASSROOM_SYNC_SECRET }}
        run: python3 scripts/sync_classroom.py
