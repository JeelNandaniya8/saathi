name: Saathi checks

on:
  push:
    branches: [main, codex/saathi-reliability, codex/saathi-sep15, codex/saathi-daily-workspace]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: saathi_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/saathi_test
      PGPASSWORD: postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile backend and smoke checker
        run: python -m py_compile app.py auth_google.py billing.py care.py study_tools.py ai_transport.py workspace_extras.py push_notifications.py daily_workspace.py scripts/smoke_test.py scripts/generate_push_keys.py

      - name: Run backend and security tests
        run: pytest -q

      - name: Check browser JavaScript
        run: bash scripts/check_javascript.sh

      - name: Check patch whitespace
        run: git diff --check
