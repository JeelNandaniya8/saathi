name: Saathi checks

on:
  push:
    branches: [main, codex/saathi-reliability, codex/saathi-sep15, codex/saathi-daily-workspace, codex/saathi-speed-sep16, codex/saathi-reply-recovery]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: saathi_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/saathi_test
      PGPASSWORD: postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile backend and smoke checker
        run: python -m py_compile server_runtime.py app.py auth_google.py billing.py care.py study_tools.py ai_transport.py workspace_extras.py push_notifications.py daily_workspace.py db_pool.py response_insights.py workspace_hub.py scripts/smoke_test.py scripts/generate_push_keys.py

      - name: Run backend and security tests
        run: pytest -q

      - name: Check browser JavaScript
        run: bash scripts/check_javascript.sh

      - name: Install isolated browser test tools
        run: |
          npm install --prefix /tmp/saathi-browser-tests --no-audit --no-fund playwright@1.62.1
          /tmp/saathi-browser-tests/node_modules/.bin/playwright install --with-deps chromium --only-shell
          sudo apt-get install -y fonts-noto-core

      - name: Exercise desktop and mobile browser flows
        env:
          NODE_PATH: /tmp/saathi-browser-tests/node_modules
        run: node tests/workspace_browser.cjs

      - name: Check signed-in UI layout and contrast
        env:
          NODE_PATH: /tmp/saathi-browser-tests/node_modules
          SAATHI_UI_REVIEW: "1"
          SAATHI_UI_ARTIFACTS: artifacts/ui
        run: node tests/workspace_browser.cjs

      - name: Keep synthetic UI review images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-ui-review
          path: artifacts/ui
          if-no-files-found: ignore
          retention-days: 7

      - name: Check patch whitespace
        run: git diff --check
