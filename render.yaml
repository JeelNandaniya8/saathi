services:
  - type: web
    name: saathi
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: DATABASE_URL
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: APP_BASE_URL
        value: https://saathi-md5w.onrender.com
      - key: COOKIE_SECURE
        value: "true"
      - key: FLASK_DEBUG
        value: "false"
